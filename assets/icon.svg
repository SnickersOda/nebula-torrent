<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Nebula Vortex/Tornado Icon -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Top wide rings (outer) -->
  <ellipse cx="256" cy="120" rx="220" ry="45" fill="none" stroke="url(#grad1)" stroke-width="12" opacity="0.2" filter="url(#glow)"/>
  <ellipse cx="256" cy="130" rx="210" ry="42" fill="none" stroke="url(#grad1)" stroke-width="12" opacity="0.25" filter="url(#glow)"/>
  <ellipse cx="256" cy="140" rx="200" ry="40" fill="none" stroke="url(#grad1)" stroke-width="12" opacity="0.3" filter="url(#glow)"/>
  <ellipse cx="256" cy="150" rx="190" ry="38" fill="none" stroke="url(#grad1)" stroke-width="14" opacity="0.35" filter="url(#glow)"/>
  
  <!-- Upper middle rings -->
  <ellipse cx="256" cy="165" rx="180" ry="36" fill="none" stroke="url(#grad1)" stroke-width="14" opacity="0.4" filter="url(#glow)"/>
  <ellipse cx="256" cy="180" rx="170" ry="34" fill="none" stroke="url(#grad1)" stroke-width="14" opacity="0.45" filter="url(#glow)"/>
  <ellipse cx="256" cy="195" rx="160" ry="32" fill="none" stroke="url(#grad1)" stroke-width="16" opacity="0.5" filter="url(#glow)"/>
  <ellipse cx="256" cy="210" rx="150" ry="30" fill="none" stroke="url(#grad1)" stroke-width="16" opacity="0.55" filter="url(#glow)"/>
  
  <!-- Middle rings -->
  <ellipse cx="256" cy="230" rx="140" ry="28" fill="none" stroke="url(#grad1)" stroke-width="16" opacity="0.6" filter="url(#glow)"/>
  <ellipse cx="256" cy="250" rx="130" ry="26" fill="none" stroke="url(#grad1)" stroke-width="18" opacity="0.65" filter="url(#glow)"/>
  <ellipse cx="256" cy="270" rx="120" ry="24" fill="none" stroke="url(#grad1)" stroke-width="18" opacity="0.7" filter="url(#glow)"/>
  <ellipse cx="256" cy="290" rx="110" ry="22" fill="none" stroke="url(#grad1)" stroke-width="18" opacity="0.75" filter="url(#glow)"/>
  
  <!-- Lower middle rings -->
  <ellipse cx="256" cy="310" rx="100" ry="20" fill="none" stroke="url(#grad1)" stroke-width="20" opacity="0.8" filter="url(#glow)"/>
  <ellipse cx="256" cy="330" rx="90" ry="18" fill="none" stroke="url(#grad1)" stroke-width="20" opacity="0.85" filter="url(#glow)"/>
  <ellipse cx="256" cy="350" rx="80" ry="16" fill="none" stroke="url(#grad1)" stroke-width="20" opacity="0.9" filter="url(#glow)"/>
  <ellipse cx="256" cy="370" rx="70" ry="14" fill="none" stroke="url(#grad1)" stroke-width="22" opacity="0.92" filter="url(#glow)"/>
  
  <!-- Bottom narrow part -->
  <ellipse cx="256" cy="390" rx="60" ry="12" fill="none" stroke="url(#grad1)" stroke-width="22" opacity="0.94" filter="url(#glow)"/>
  <ellipse cx="256" cy="410" rx="50" ry="10" fill="none" stroke="url(#grad1)" stroke-width="24" opacity="0.96" filter="url(#glow)"/>
  <ellipse cx="256" cy="430" rx="40" ry="8" fill="none" stroke="url(#grad1)" stroke-width="24" opacity="0.98" filter="url(#glow)"/>
  <ellipse cx="256" cy="450" rx="30" ry="6" fill="none" stroke="url(#grad1)" stroke-width="26" filter="url(#glow)"/>
  <ellipse cx="256" cy="470" rx="20" ry="4" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Stars/particles around the vortex -->
  <circle cx="120" cy="100" r="4" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="390" cy="110" r="3" fill="#06b6d4" opacity="0.8" filter="url(#glow)"/>
  <circle cx="180" cy="80" r="3" fill="#a855f7" opacity="0.7" filter="url(#glow)"/>
  <circle cx="350" cy="90" r="4" fill="#3b82f6" opacity="0.8" filter="url(#glow)"/>
  <circle cx="420" cy="140" r="3" fill="#ffffff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="90" cy="130" r="3" fill="#06b6d4" opacity="0.7" filter="url(#glow)"/>
  <circle cx="450" cy="180" r="2" fill="#a855f7" opacity="0.5" filter="url(#glow)"/>
  <circle cx="60" cy="170" r="2" fill="#3b82f6" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Additional small stars -->
  <circle cx="200" cy="60" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="320" cy="70" r="2" fill="#06b6d4" opacity="0.6"/>
  <circle cx="150" cy="120" r="1.5" fill="#a855f7" opacity="0.4"/>
  <circle cx="370" cy="130" r="1.5" fill="#3b82f6" opacity="0.5"/>
</svg>
